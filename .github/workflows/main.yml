name: Build RCJMS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - name: Clean previous build
        shell: powershell
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Force RCJMS.jar -ErrorAction SilentlyContinue

      - name: Compile Java sources
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build

          $files = @(Get-ChildItem -Path src -Filter *.java -Recurse)

          if ($files.Count -eq 0) {
            Write-Error "No Java source files found in src/"
            exit 1
          }

          Write-Host "Compiling:"
          $files | ForEach-Object {
            Write-Host $_.FullName
          }

          javac -encoding UTF-8 -d build $files.FullName

      - name: Create JAR
        shell: powershell
        run: |
          jar --create `
            --file RCJMS.jar `
            --main-class RCM3DMM `
            -C build .

      - name: Test JAR
        shell: powershell
        run: |
          Write-Host "Testing RCJMS.jar..."

          java -jar RCJMS.jar

      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package

          Copy-Item RCJMS.jar package/

          if (Test-Path assets) {
            Copy-Item assets package/assets -Recurse
          }

      - name: Create EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist

          jpackage `
            --input package `
            --name "RCJMS - RayCast Java Maze Simulator" `
            --main-jar RCJMS.jar `
            --main-class RCM3DMM `
            --type exe `
            --dest dist `
            --app-version "1.0.${{ github.run_number }}" `
            --win-menu `
            --win-shortcut `
            --win-per-user-install

      - name: Remove old Latest tested release
        shell: powershell
        run: |
          gh release delete latest-tested --yes --cleanup-tag 2>$null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish Latest tested
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-tested
          name: Latest tested
          body: |
            🟢 Latest successfully built version of RCJMS.

            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
          files: dist/*.exe
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
