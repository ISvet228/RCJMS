name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            archive: RCJMS-Windows.zip

          - os: ubuntu-latest
            platform: Linux
            archive: RCJMS-Linux.zip

          - os: macos-15
            platform: macOS
            archive: RCJMS-macOS.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Check Java
        run: java -version

      - name: Compile
        shell: bash
        run: |
          rm -rf build
          mkdir -p build
          find src -name "*.java" -print0 | xargs -0 javac -d build

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file RCJMS.jar \
            --main-class RCJMS \
            -C build .

      - name: Prepare package
        shell: bash
        run: |
          rm -rf package
          mkdir -p package

          cp RCJMS.jar package/

          if [ -d "src/Localization" ]; then
            cp -r src/Localization package/
          fi

      - name: Build portable application
        shell: bash
        run: |
          rm -rf dist

          jpackage \
            --input package \
            --name RCJMS \
            --main-jar RCJMS.jar \
            --main-class RCJMS \
            --type app-image \
            --dest dist

      - name: Create archive
        shell: bash
        run: |
          cd dist

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            7z a "../${{ matrix.archive }}" RCJMS
          else
            zip -r "../${{ matrix.archive }}" RCJMS
          fi

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-${{ matrix.platform }}
          path: ${{ matrix.archive }}

      - name: Upload JAR
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-JAR
          path: RCJMS.jar

  release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            artifacts/RCJMS.jar \
            artifacts/RCJMS-Windows.zip \
            artifacts/RCJMS-Linux.zip \
            artifacts/RCJMS-macOS.zip
