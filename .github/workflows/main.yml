name: Build RCJMS

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            archive: RCJMS-Windows.zip

          - platform: Linux
            os: ubuntu-latest
            archive: RCJMS-Linux.zip

          - platform: macOS
            os: macos-15
            archive: RCJMS-macOS.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        shell: bash
        run: |
          rm -rf build
          mkdir -p build
          find src -name "*.java" -print > sources.txt
          javac -d build @sources.txt

      - name: Copy resources
        shell: bash
        run: |
          if [ -d src/Localization ]; then
            cp -r src/Localization build/
          fi

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file RCJMS.jar \
            --main-class RCJMS \
            -C build .

      - name: Test JAR
        shell: bash
        run: |
          test -f RCJMS.jar
          jar tf RCJMS.jar > /dev/null

      - name: Prepare jpackage input
        shell: bash
        run: |
          rm -rf package dist
          mkdir -p package
          cp RCJMS.jar package/

      - name: Create portable application
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --input package \
            --name RCJMS \
            --main-jar RCJMS.jar \
            --main-class RCJMS \
            --dest dist

      - name: Debug dist output
        shell: bash
        run: |
          echo "--- root ---"
          ls -la
          echo "--- dist ---"
          ls -la dist || true
          echo "--- recursive dist ---"
          find dist -maxdepth 4 -print || true

      - name: Create Windows archive
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d "dist/RCJMS" ]; then
            cd dist
            7z a "../${{ matrix.archive }}" RCJMS
          else
            echo "ERROR: dist/RCJMS not found"
            find dist -maxdepth 4 -print || true
            exit 1
          fi

      - name: Create macOS archive
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d "dist/RCJMS.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              dist/RCJMS.app \
              "${{ matrix.archive }}"
          else
            echo "ERROR: dist/RCJMS.app not found"
            find dist -maxdepth 4 -print || true
            exit 1
          fi

      - name: Create Linux archive
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d "dist/RCJMS" ]; then
            cd dist
            zip -r "../${{ matrix.archive }}" RCJMS
          else
            echo "ERROR: dist/RCJMS not found"
            find dist -maxdepth 4 -print || true
            exit 1
          fi

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-${{ matrix.platform }}
          path: ${{ matrix.archive }}

      - name: Upload JAR
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-JAR
          path: RCJMS.jar

  release:
    name: Upload Release Assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        run: |
          ls -lah artifacts
          test -f artifacts/RCJMS.jar
          test -f artifacts/RCJMS-Windows.zip
          test -f artifacts/RCJMS-Linux.zip
          test -f artifacts/RCJMS-macOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Complete-Ver"
          name: "Latest Tusted"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/RCJMS.jar
            artifacts/RCJMS-Windows.zip
            artifacts/RCJMS-Linux.zip
            artifacts/RCJMS-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
