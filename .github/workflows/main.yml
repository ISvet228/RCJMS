name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            archive: RCJMS-Windows.zip

          - os: ubuntu-latest
            platform: Linux
            archive: RCJMS-Linux.zip

          - os: macos-15-intel
            platform: macOS
            archive: RCJMS-macOS.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk

      - name: Check Java
        run: java -version

      - name: Build JAR
        shell: bash
        run: |
          mkdir -p build
          javac -d build $(find . -name "*.java" -not -path "./build/*")
          jar --create --file RCJMS.jar --main-class RCJMS -C build .

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p package
          cp RCJMS.jar package/

          if [ -d "tmp" ]; then
            cp -r tmp package/
          fi

      - name: Build portable application
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist

          jpackage \
            --input package \
            --name RCJMS \
            --main-jar RCJMS.jar \
            --main-class RCJMS \
            --type app-image \
            --dest dist

      - name: Create ZIP
        shell: bash
        run: |
          cd dist

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            7z a "../${{ matrix.archive }}" RCJMS
          else
            zip -r "../${{ matrix.archive }}" RCJMS
          fi

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-${{ matrix.platform }}
          path: ${{ matrix.archive }}

  release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download builds
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            artifacts/RCJMS-Windows/RCJMS-Windows.zip \
            artifacts/RCJMS-Linux/RCJMS-Linux.zip \
            artifacts/RCJMS-macOS/RCJMS-macOS.zip
