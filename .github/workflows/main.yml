name: Build RCJMS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # Получаем исходники
      - name: Checkout
        uses: actions/checkout@v5

      # Устанавливаем JDK 21
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      # Компиляция всех .java файлов
      - name: Compile
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build

          $files = Get-ChildItem -Path src -Filter *.java -Recurse

          if ($files.Count -eq 0) {
            Write-Error "No Java source files found in src/"
            exit 1
          }

          javac -d build $files.FullName

      # Создание JAR
      - name: Create JAR
        shell: powershell
        run: |
          jar --create `
            --file RCJMS.jar `
            --main-class Main `
            -C build .

      # Подготовка папки с приложением и assets
      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package

          Copy-Item RCJMS.jar package/

          if (Test-Path assets) {
            Copy-Item assets package/assets -Recurse
          }

      # Создание Windows EXE с встроенной Java Runtime
      - name: Create EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist

          jpackage `
            --input package `
            --name "RCJMS - RayCast Java Maze Simulator" `
            --main-jar RCJMS.jar `
            --main-class Main `
            --type exe `
            --dest dist `
            --win-menu `
            --win-shortcut `
            --app-version 1.0.${{ github.run_number }}

      # Обновление релиза Latest tested
      - name: Publish Latest tested Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-tested
          name: "Latest tested"
          body: |
            🟢 Latest successfully built version of RCJMS.

            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
          files: dist/*.exe
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
