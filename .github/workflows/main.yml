name: Build RCJMS

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    env:
      ARCHIVE: RCJMS-With-JDK-Windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '22'

      - name: Compile
        shell: bash
        run: |
          rm -rf build
          mkdir -p build

          find src -name "*.java" -print > sources.txt
          javac -encoding UTF-8 -d build @sources.txt

      - name: Copy resources
        shell: bash
        run: |
          if [ -d src/Localization ]; then
            cp -r src/Localization build/
          fi

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file RCJMS.jar \
            --main-class RCJMS \
            -C build .

      - name: Test JAR
        shell: bash
        run: |
          test -f RCJMS.jar
          jar --describe-module --file RCJMS.jar || true
          jar tf RCJMS.jar

      - name: Prepare jpackage input
        shell: bash
        run: |
          rm -rf package dist
          mkdir package
          cp RCJMS.jar package/

      - name: Create portable application
        shell: bash
        run: |
          # jdk.compiler is needed at runtime so engine mods can be compiled.
          # jpackage doesn't add it on its own because the game only refers to javax.tools.
          jpackage \
            --type app-image \
            --input package \
            --name RCJMS \
            --main-jar RCJMS.jar \
            --main-class RCJMS \
            --add-modules java.desktop,jdk.compiler \
            --dest dist

      - name: Verify compiler module in runtime
        shell: bash
        run: |
          # jpackage app-images have no java.exe in runtime/bin (the app starts from RCJMS.exe),
          # so check the module list that jlink writes into runtime/release instead.
          RELEASE=$(find dist -path "*runtime/release" | head -n 1)
          if [ -z "$RELEASE" ]; then
            echo "::error::runtime/release not found under dist/. Contents:"
            find dist -maxdepth 3
            exit 1
          fi
          echo "Checking: $RELEASE"
          if ! grep "^MODULES=" "$RELEASE" | grep -q "jdk.compiler"; then
            echo "::error::jdk.compiler is missing from the runtime."
            grep "^MODULES=" "$RELEASE"
            exit 1
          fi
          echo "jdk.compiler is in the runtime."

      - name: Add engine mods folder
        shell: bash
        run: |
          # Mods are read from ExternalEngines next to RCJMS.exe.
          if [ -d ExternalEngines ]; then
            cp -r ExternalEngines dist/RCJMS/
          fi

      - name: Create Windows archive
        shell: bash
        run: |
          test -d dist/RCJMS
          cd dist/RCJMS
          7z a "../../${{ env.ARCHIVE }}" .

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-With-JDK-Windows
          path: ${{ env.ARCHIVE }}

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-JAR
          path: RCJMS.jar

  release:
    name: Upload Release Assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        run: |
          ls -lah artifacts
          test -f artifacts/RCJMS.jar
          test -f artifacts/RCJMS-With-JDK-Windows.zip

      - name: Delete existing release and tag (if any)
        uses: actions/github-script@v6
        with:
          script: |
            const tag = 'Complete-Ver';
            const { owner, repo } = context.repo;
            // Try to find existing release by tag and delete it
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.data.id });
              console.log(`Deleted existing release id=${rel.data.id} (tag=${tag})`);
            } catch (e) {
              if (e.status === 404) {
                console.log(`No existing release with tag ${tag}`);
              } else {
                throw e;
              }
            }
            // Try to delete the git tag ref as well (ignore if absent)
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              console.log(`Deleted git tag refs/tags/${tag}`);
            } catch (e) {
              if (e.status === 422 || e.status === 404) {
                console.log(`Tag refs/tags/${tag} not found or already deleted`);
              } else {
                throw e;
              }
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Complete-Ver"
          name: "Latest Tusted"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/RCJMS.jar
            artifacts/RCJMS-With-JDK-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
