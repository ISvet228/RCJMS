name: Build RCJMS

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            os: windows-latest
            archive: RCJMS-With-JDK-Windows-x64.zip

          - platform: Linux-x64
            os: ubuntu-latest
            archive: RCJMS-With-JDK-Linux-x64.zip

          - platform: macOS-Apple-Silicon
            os: macos-15
            archive: RCJMS-With-JDK-macOS-Apple-Silicon.zip
            expected_arch: arm64

          - platform: macOS-Intel
            os: macos-15-intel
            archive: RCJMS-With-JDK-macOS-Intel.zip
            expected_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Show build architecture
        shell: bash
        run: |
          uname -a
          uname -m
          java -version

      - name: Compile
        shell: bash
        run: |
          rm -rf build
          mkdir -p build

          find src -name "*.java" -print > sources.txt
          javac -d build @sources.txt

      - name: Copy resources
        shell: bash
        run: |
          if [ -d src/Localization ]; then
            cp -r src/Localization build/
          fi

      - name: Create JAR
        shell: bash
        run: |
          jar --create \
            --file RCJMS.jar \
            --main-class RCJMS \
            -C build .

      - name: Test JAR
        shell: bash
        run: |
          test -f RCJMS.jar
          jar --describe-module --file RCJMS.jar || true
          jar tf RCJMS.jar

      - name: Prepare jpackage input
        shell: bash
        run: |
          rm -rf package dist
          mkdir package
          cp RCJMS.jar package/

      - name: Create portable application
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --input package \
            --name RCJMS \
            --main-jar RCJMS.jar \
            --main-class RCJMS \
            --dest dist

      - name: Test macOS application architecture
        if: startsWith(matrix.platform, 'macOS-')
        shell: bash
        run: |
          set -e
          APP="dist/RCJMS.app"
          BINARY="$APP/Contents/MacOS/RCJMS"

          test -d "$APP"
          test -x "$BINARY"

          file "$BINARY"
          file "$BINARY" | grep -E "${{ matrix.expected_arch }}|universal"

          otool -L "$BINARY"

      - name: Test Windows application
        if: matrix.platform == 'Windows-x64'
        shell: bash
        run: |
          test -d dist/RCJMS
          test -f dist/RCJMS/RCJMS.exe

      - name: Test Linux application
        if: matrix.platform == 'Linux-x64'
        shell: bash
        run: |
          test -d dist/RCJMS
          test -x dist/RCJMS/RCJMS

      - name: Create Windows archive
        if: matrix.platform == 'Windows-x64'
        shell: bash
        run: |
          test -d dist/RCJMS
          cd dist/RCJMS
          7z a "../../${{ matrix.archive }}" .

      - name: Create macOS archive
        if: startsWith(matrix.platform, 'macOS-')
        shell: bash
        run: |
          test -d dist/RCJMS.app
          ditto -c -k --sequesterRsrc --keepParent \
            dist/RCJMS.app \
            "${{ matrix.archive }}"

      - name: Create Linux archive
        if: matrix.platform == 'Linux-x64'
        shell: bash
        run: |
          test -d dist/RCJMS
          cd dist/RCJMS
          zip -r "../../${{ matrix.archive }}" .

      - name: Verify archive exists
        shell: bash
        run: |
          test -f "${{ matrix.archive }}"
          unzip -l "${{ matrix.archive }}" | head -40 || true

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

      - name: Upload JAR
        if: matrix.platform == 'Linux-x64'
        uses: actions/upload-artifact@v5
        with:
          name: RCJMS-JAR
          path: RCJMS.jar

  release:
    name: Upload Release Assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        shell: bash
        run: |
          ls -lah artifacts
          test -f artifacts/RCJMS.jar
          test -f artifacts/RCJMS-With-JDK-Windows-x64.zip
          test -f artifacts/RCJMS-With-JDK-Linux-x64.zip
          test -f artifacts/RCJMS-With-JDK-macOS-Apple-Silicon.zip
          test -f artifacts/RCJMS-With-JDK-macOS-Intel.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Complete-Ver"
          name: "Latest Trusted"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/RCJMS.jar
            artifacts/RCJMS-With-JDK-Windows-x64.zip
            artifacts/RCJMS-With-JDK-Linux-x64.zip
            artifacts/RCJMS-With-JDK-macOS-Apple-Silicon.zip
            artifacts/RCJMS-With-JDK-macOS-Intel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
